<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill details — Skillfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{paper:'#F4F6F0',ink:'#17203B',cobalt:'#2545E5',orange:'#F2683A',mist:'#DDE3F5',lime:'#C9EF72'},fontFamily:{display:['Space Grotesk','sans-serif'],body:['Manrope','sans-serif'],mono:['IBM Plex Mono','monospace']},boxShadow:{card:'6px 6px 0 #17203B'}}}}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body{background:#F4F6F0}
    .docs-grid{background-image:linear-gradient(rgba(37,69,229,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(37,69,229,.055) 1px,transparent 1px);background-size:24px 24px}
    .readme-content{color:#303850;font-size:16px;line-height:1.78}
    .readme-content>*:first-child{margin-top:0}
    .readme-content h1,.readme-content h2,.readme-content h3,.readme-content h4{font-family:'Space Grotesk',sans-serif;color:#17203B;font-weight:600;letter-spacing:-.025em;line-height:1.18;scroll-margin-top:6rem}
    .readme-content h1{font-size:2.5rem;margin:0 0 1.5rem;padding-bottom:1rem;border-bottom:2px solid #17203B}
    .readme-content h2{font-size:1.8rem;margin:3.5rem 0 1rem;padding-bottom:.7rem;border-bottom:1px solid rgba(23,32,59,.15)}
    .readme-content h3{font-size:1.3rem;margin:2.2rem 0 .8rem}
    .readme-content h4{font-size:1.05rem;margin:1.8rem 0 .6rem}
    .readme-content p,.readme-content ul,.readme-content ol,.readme-content blockquote,.readme-content table,.readme-content pre{margin:1rem 0}
    .readme-content ul,.readme-content ol{padding-left:1.4rem}
    .readme-content ul{list-style:disc}.readme-content ol{list-style:decimal}.readme-content li{padding-left:.25rem;margin:.35rem 0}
    .readme-content a{color:#2545E5;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
    .readme-content a:hover{color:#F2683A}
    .readme-content strong{color:#17203B;font-weight:700}
    .readme-content blockquote{border-left:4px solid #C9EF72;background:#F4F6F0;padding:1rem 1.25rem;color:rgba(23,32,59,.72)}
    .readme-content blockquote p{margin:0}
    .readme-content code{font-family:'IBM Plex Mono',monospace;font-size:.86em;background:#E9ECF6;color:#17203B;padding:.18rem .38rem;border-radius:.25rem}
    .readme-content pre{position:relative;background:#17203B;color:#F4F6F0;padding:1.25rem;border:2px solid #17203B;overflow:auto;box-shadow:4px 4px 0 #C9EF72}
    .readme-content pre code{background:transparent;color:inherit;padding:0;font-size:.82rem;line-height:1.7}
    .readme-content table{display:block;width:100%;overflow-x:auto;border-collapse:collapse;font-size:.9rem}
    .readme-content th{background:#17203B;color:white;text-align:left}.readme-content th,.readme-content td{border:1px solid rgba(23,32,59,.2);padding:.7rem .85rem;vertical-align:top}.readme-content tr:nth-child(even) td{background:#F7F8F5}
    .readme-content img{display:inline-block;max-width:100%;height:auto;margin:.2rem .15rem}
    .readme-content hr{border:0;border-top:2px solid #17203B;margin:3rem 0}
    .readme-skeleton{background:linear-gradient(90deg,#EEF0EA 25%,#F9FAF7 50%,#EEF0EA 75%);background-size:200% 100%;animation:skeleton 1.4s infinite}
    @keyframes skeleton{to{background-position:-200% 0}}
    @media(prefers-reduced-motion:no-preference){.enter{animation:rise .45s ease both}@keyframes rise{from{opacity:0;transform:translateY(12px)}}}
    @media(prefers-reduced-motion:reduce){.readme-skeleton{animation:none}}
  </style>
</head>
<body class="min-h-screen bg-paper text-ink font-body selection:bg-lime">
  <header class="border-b-2 border-ink bg-paper/95 sticky top-0 z-30 backdrop-blur">
    <nav class="mx-auto max-w-[1280px] h-16 px-5 lg:px-10 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 font-display font-bold text-lg"><span class="grid place-items-center w-8 h-8 bg-cobalt text-white rounded-full text-sm">S</span> SKILLFOLIO</a>
      <a href="index.html#library" class="font-mono text-xs uppercase tracking-wider hover:text-cobalt">← Back to library</a>
    </nav>
  </header>

  <main id="detailRoot" class="enter"></main>

  <footer class="border-t-2 border-ink"><div class="mx-auto max-w-[1380px] px-5 lg:px-10 py-9 flex justify-between text-sm"><p class="font-display font-bold">SKILLFOLIO</p><a href="index.html" class="underline underline-offset-4">Browse every skill</a></div></footer>
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 translate-y-24 opacity-0 bg-ink text-white px-5 py-3 font-mono text-xs transition-all duration-300 z-50" role="status">Copied to clipboard</div>
  <script src="app.js"></script>
</body>
</html>
