[build]
  command = "pnpm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.30.3"
  VITE_SITE_URL = "https://skillfoliox.netlify.app"

[[headers]]
  for = "/skillfolio-preview-square-v3.png"

  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "image/png"
