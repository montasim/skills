name: Skill bug
description: Report reproducible behavior in one skill
title: "[skill]: "
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: fix-social-link-previews
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or source commit
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - Claude Code
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include sanitized commands, inputs, expected behavior, and actual behavior.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private repository content, and personal data.
          required: true
