name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run pack:check
      - run: npm run smoke:install
      - run: git diff --exit-code

  skillfolio:
    name: Skillfolio application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/skillfolio/pnpm-lock.yaml
      - name: Install Skillfolio dependencies
        working-directory: apps/skillfolio
        run: pnpm install --frozen-lockfile
      - name: Smoke-test Skillfolio dev startup
        working-directory: apps/skillfolio
        run: pnpm smoke:dev
      - name: Check generated catalog
        run: node scripts/generate-skillfolio-catalog.mjs --check
      - name: Test Skillfolio
        working-directory: apps/skillfolio
        run: pnpm test
      - name: Lint Skillfolio
        working-directory: apps/skillfolio
        run: pnpm lint
      - name: Type-check Skillfolio
        working-directory: apps/skillfolio
        run: pnpm typecheck
      - name: Check Skillfolio formatting
        working-directory: apps/skillfolio
        run: pnpm check
      - name: Build Skillfolio
        working-directory: apps/skillfolio
        run: pnpm build
      - run: git diff --exit-code
